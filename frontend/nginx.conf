# gateway: serve a Interface Web e implementa a API da Plataforma (spec §2, §5)
# encaminhando cada rota a um webhook de produção do n8n.
#
# O n8n registra caminhos com parâmetros (":id") prefixados pelo ID do nó do
# webhook. Para manter o contrato limpo, o gateway reescreve as rotas com ID
# para webhooks estáticos, passando o ID como query string (?id=).
#   /api/ataques                     -> /webhook/plataforma/ataques
#   /api/avaliacoes/7/resumo?x=1     -> /webhook/plataforma/avaliacao-resumo?id=7&x=1

upstream n8n_webhooks {
    server n8n:5678;
}

server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # Interface Web: só arquivos estáticos locais (sem CDN)
    location ~ /(nginx\.conf)$ { return 404; }
    location / {
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # ---------------- API da Plataforma ----------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    client_max_body_size 16m;
    proxy_intercept_errors off;

    location = /api/ataques              { rewrite ^ /webhook/plataforma/ataques break;            proxy_pass http://n8n_webhooks; error_page 502 503 504 = @indisponivel; }
    location = /api/modelos              { rewrite ^ /webhook/plataforma/modelos break;            proxy_pass http://n8n_webhooks; error_page 502 503 504 = @indisponivel; }
    location = /api/avaliacoes           { rewrite ^ /webhook/plataforma/avaliacoes break;         proxy_pass http://n8n_webhooks; error_page 502 503 504 = @indisponivel; }
    location = /api/avaliacoes/validar   { rewrite ^ /webhook/plataforma/avaliacoes-validar break; proxy_pass http://n8n_webhooks; error_page 502 503 504 = @indisponivel; }

    location ~ ^/api/avaliacoes/(\d+)$ {
        rewrite ^/api/avaliacoes/(\d+)$ /webhook/plataforma/avaliacao?id=$1 break;
        proxy_pass http://n8n_webhooks;
        error_page 502 503 504 = @indisponivel;
    }
    location ~ ^/api/avaliacoes/(\d+)/(executar|resumo|tentativas|csv)$ {
        rewrite ^/api/avaliacoes/(\d+)/(\w+)$ /webhook/plataforma/avaliacao-$2?id=$1 break;
        proxy_pass http://n8n_webhooks;
        error_page 502 503 504 = @indisponivel;
    }
    location ~ ^/api/tentativas/(\d+)$ {
        rewrite ^/api/tentativas/(\d+)$ /webhook/plataforma/tentativa?id=$1 break;
        proxy_pass http://n8n_webhooks;
        error_page 502 503 504 = @indisponivel;
    }
    location ~ ^/api/tentativas/(\d+)/revisao$ {
        rewrite ^/api/tentativas/(\d+)/revisao$ /webhook/plataforma/tentativa-revisao?id=$1 break;
        proxy_pass http://n8n_webhooks;
        error_page 502 503 504 = @indisponivel;
    }

    # Qualquer outra rota da API
    location /api/ {
        default_type application/json;
        return 404 '{"erro":"Rota não encontrada na API da Plataforma."}';
    }

    location @indisponivel {
        default_type application/json;
        return 503 '{"erro":"API da Plataforma indisponível: o n8n não respondeu. Verifique se o contêiner n8n está no ar."}';
    }
}
