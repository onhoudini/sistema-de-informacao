# Plataforma Local de Avaliação de Segurança de Modelos de Linguagem
# Todas as portas publicadas ficam presas a 127.0.0.1 (RNF01, RNF03).

name: plataforma

x-ollama-host: &ollama-host
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16.16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      N8N_DB_USER: ${N8N_DB_USER:-n8n}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?defina N8N_DB_PASSWORD no .env}
      PLATAFORMA_DB_USER: ${PLATAFORMA_DB_USER:-plataforma_app}
      PLATAFORMA_DB_PASSWORD: ${PLATAFORMA_DB_PASSWORD:?defina PLATAFORMA_DB_PASSWORD no .env}
    volumes:
      - postgres-dados:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./ataques:/ataques:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d plataforma"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [interna]

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-1.123.98}
    restart: unless-stopped
    <<: *ollama-host
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${N8N_EDITOR_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      TZ: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      N8N_HOST: 127.0.0.1
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Telemetria e chamadas externas desligadas (spec §2.1). Não remova.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_DIAGNOSTICS_CONFIG_FRONTEND: ""
      N8N_DIAGNOSTICS_CONFIG_BACKEND: ""
      EXTERNAL_FRONTEND_HOOKS_URLS: ""
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      # Endereços internos usados pelos workflows ($env.*)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      VERIFICADOR_URL: ${VERIFICADOR_URL:-http://verificador:8000}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Avaliações longas: sem timeout de execução; histórico de execuções podado
      EXECUTIONS_TIMEOUT: "-1"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes:
      - n8n-dados:/home/node/.n8n
      - ./n8n/workflows:/workflows
    networks: [interna, externa]

  verificador:
    build: ./verificador
    image: plataforma-verificador:local
    restart: unless-stopped
    <<: *ollama-host
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/saude').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Precisa da rede "externa" apenas para alcançar o Ollama no host (juiz).
    networks: [interna, externa]

  gateway:
    image: nginx:${NGINX_VERSION:-1.31.9-alpine}
    restart: unless-stopped
    depends_on: [n8n]
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks: [interna, externa]

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.16}
    profiles: [ollama]
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-dados:/root/.ollama
    networks: [interna, externa]

  cli:
    build: ./cli
    image: plataforma-cli:local
    profiles: [cli]
    environment:
      PLATAFORMA_API_URL: http://gateway/api
    working_dir: /projeto
    volumes:
      - ./:/projeto:ro
      - ./saida:/projeto/saida
    # Só a rede interna: sem saída para a internet (spec §2.1)
    networks: [interna]

networks:
  interna:
    internal: true
  externa: {}

volumes:
  postgres-dados:
  n8n-dados:
  ollama-dados:
